<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viezan Subtitles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --vzn-subtitle-chrome: rgba(24, 27, 33, 0.94);
      --vzn-subtitle-chrome-strong: rgba(15, 23, 32, 0.92);
      --vzn-subtitle-control: rgba(255, 255, 255, 0.08);
      --vzn-subtitle-control-hover: rgba(255, 255, 255, 0.13);
      --vzn-subtitle-border: rgba(216, 224, 232, 0.16);
      --vzn-subtitle-text: rgba(232, 237, 242, 0.84);
      --vzn-subtitle-muted: rgba(232, 237, 242, 0.42);
      --vzn-subtitle-soft: rgba(232, 237, 242, 0.26);
      --vzn-subtitle-strong: #ffffff;
      --vzn-accent: #38bdf8;
      --vzn-accent-soft: rgba(56, 189, 248, 0.20);
      --vzn-info: #38bdf8;
      --vzn-info-soft: rgba(56, 189, 248, 0.18);
      --vzn-success: #4ade80;
      --vzn-success-soft: rgba(74, 222, 128, 0.18);
      --vzn-warning: #fbbf24;
      --vzn-warning-soft: rgba(251, 191, 36, 0.18);
      --vzn-danger: #fb7185;
      --vzn-danger-soft: rgba(251, 113, 133, 0.18);
      --vzn-provider: #5e6a78;
      --vzn-shadow: 0 18px 44px rgba(0, 0, 0, 0.52), 0 2px 8px rgba(0, 0, 0, 0.22);
    }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      user-select: none;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .wrapper {
      display: flex; flex-direction: column;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--vzn-shadow);
    }

    /* ── Handle bar ────────────────────────────────────────────────────────── */
    .handle {
      flex-shrink: 0;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 5px 10px; height: 34px;
      background: var(--vzn-subtitle-chrome-strong);
      -webkit-app-region: drag;
    }
    .grip  { color: var(--vzn-subtitle-soft); font-size: 14px; letter-spacing: 1px; }
    .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--vzn-subtitle-soft); }
    .close-btn {
      -webkit-app-region: no-drag;
      background: none; border: none;
      color: var(--vzn-subtitle-muted); cursor: pointer;
      font-size: 12px; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; padding: 0;
      transition: color 0.15s, background 0.15s;
    }
    .close-btn:hover { color: var(--vzn-subtitle-strong); background: var(--vzn-subtitle-control-hover); }

    /* ── Status badge (in handle bar) ──────────────────────────────────────── */
    .status-badge {
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: color 0.3s, background 0.3s, border-color 0.3s;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    /* Stopped */
    .status-badge.stopped { color: var(--vzn-subtitle-muted); background: var(--vzn-subtitle-control); border-color: var(--vzn-subtitle-border); }
    .status-badge.stopped .status-dot { background: var(--vzn-subtitle-muted); }
    /* Listening */
    .status-badge.listening { color: var(--vzn-success); background: var(--vzn-success-soft); border-color: var(--vzn-success); }
    .status-badge.listening .status-dot { background: var(--vzn-success); animation: pulse-green 1.5s ease-in-out infinite; }
    /* Transcribing */
    .status-badge.transcribing { color: var(--vzn-info); background: var(--vzn-info-soft); border-color: var(--vzn-info); }
    .status-badge.transcribing .status-dot { background: var(--vzn-info); animation: pulse-blue 0.8s ease-in-out infinite; }
    /* Translating */
    .status-badge.translating { color: var(--vzn-warning); background: var(--vzn-warning-soft); border-color: var(--vzn-warning); }
    .status-badge.translating .status-dot { background: var(--vzn-warning); animation: pulse-yellow 0.6s ease-in-out infinite; }

    @keyframes pulse-green  { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }
    @keyframes pulse-blue   { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    @keyframes pulse-yellow { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── Controls row 1 ─────────────────────────────────────────────────────── */
    .controls {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; height: 40px;
      background: var(--vzn-subtitle-chrome);
      border-top: 1px solid var(--vzn-subtitle-border);
      -webkit-app-region: no-drag;
      position: relative;
    }

    /* ── Controls row 2 ─────────────────────────────────────────────────────── */
    .controls2 {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; height: 36px;
      background: var(--vzn-subtitle-chrome);
      border-top: 1px solid var(--vzn-subtitle-border);
      -webkit-app-region: no-drag;
    }

    /* ── Provider dropdown ───────────────────────────────────────────────────── */
    .provider-dropdown { position: relative; flex-shrink: 0; }
    .provider-btn {
      display: flex; align-items: center; gap: 5px;
      background: var(--vzn-subtitle-control);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 5px; color: var(--vzn-subtitle-text);
      font-size: 11px; padding: 3px 7px 3px 5px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .provider-btn:hover { background: var(--vzn-subtitle-control-hover); }
    .provider-btn .caret { color: var(--vzn-subtitle-muted); font-size: 9px; margin-left: 1px; }
    .provider-menu {
      display: none; position: absolute;
      top: calc(100% + 4px); left: 0;
      background: var(--vzn-subtitle-chrome-strong);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 7px; padding: 4px;
      min-width: 130px; z-index: 100;
      box-shadow: var(--vzn-shadow);
    }
    .provider-menu.open { display: block; }
    .provider-option {
      display: flex; align-items: center; gap: 7px;
      width: 100%; background: none; border: none;
      color: var(--vzn-subtitle-text); font-size: 11px;
      padding: 5px 8px; border-radius: 5px;
      cursor: pointer; text-align: left;
      transition: background 0.12s;
    }
    .provider-option:hover { background: var(--vzn-subtitle-control-hover); }
    .provider-option.active { background: var(--vzn-accent-soft); color: var(--vzn-subtitle-strong); }

    /* ── Selectors ───────────────────────────────────────────────────────────── */
    .sel {
      flex: 1; min-width: 0;
      background: var(--vzn-subtitle-control);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 5px; color: var(--vzn-subtitle-text);
      font-size: 11px; padding: 3px 5px;
      height: 28px; cursor: pointer; outline: none;
    }
    .sel:hover { background: var(--vzn-subtitle-control-hover); }
    .sel option { background: #181b21; color: #fff; }

    /* ── Start/Stop ──────────────────────────────────────────────────────────── */
    .start-btn {
      flex-shrink: 0;
      background: var(--vzn-success-soft);
      border: 1px solid var(--vzn-success);
      border-radius: 5px; color: var(--vzn-success);
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .start-btn:hover { background: var(--vzn-success-soft); }
    .start-btn.active { background: var(--vzn-warning-soft); border-color: var(--vzn-warning); color: var(--vzn-warning); }
    .start-btn.active:hover { background: var(--vzn-warning-soft); }

    /* ── New session button ───────────────────────────────────────────────────── */
    .new-btn {
      flex-shrink: 0;
      background: var(--vzn-subtitle-control);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 5px; color: var(--vzn-subtitle-muted);
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; height: 28px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .new-btn:hover { background: var(--vzn-danger-soft); border-color: var(--vzn-danger); color: var(--vzn-danger); }

    /* ── Audio mode buttons (SVG icons) ──────────────────────────────────────── */
    .audio-group { display: flex; gap: 3px; flex-shrink: 0; }
    .audio-btn {
      display: flex; align-items: center; gap: 4px;
      background: var(--vzn-subtitle-control);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 4px; color: var(--vzn-subtitle-muted);
      font-size: 10px; padding: 2px 7px; height: 24px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .audio-btn svg { flex-shrink: 0; }
    .audio-btn:hover { background: var(--vzn-subtitle-control-hover); color: var(--vzn-subtitle-text); }
    .audio-btn.active {
      background: var(--vzn-info-soft);
      border-color: var(--vzn-info);
      color: var(--vzn-info);
    }
    .ctrl-label { font-size: 9px; color: var(--vzn-subtitle-muted); white-space: nowrap; flex-shrink: 0; }

    /* ── Language selector ───────────────────────────────────────────────────── */
    .lang-sel {
      flex: 1; min-width: 0;
      background: var(--vzn-subtitle-control);
      border: 1px solid var(--vzn-subtitle-border);
      border-radius: 4px; color: var(--vzn-subtitle-text);
      font-size: 10px; padding: 2px 5px;
      height: 24px; cursor: pointer; outline: none;
    }
    .lang-sel:hover { background: var(--vzn-subtitle-control-hover); }
    .lang-sel option { background: #181b21; color: #fff; }

    /* ── Content area ────────────────────────────────────────────────────────── */
    .body {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 8px 18px 10px;
      min-height: 0; overflow-y: auto;
      background: var(--vzn-subtitle-chrome);
      transition: background 0.2s;
      -webkit-app-region: no-drag;
    }
    .subtitle-list {
      width: 100%;
      display: flex; flex-direction: column;
      gap: 6px;
    }
    .subtitle-entry {
      width: 100%;
    }
    .source-text {
      display: none;
      color: var(--vzn-subtitle-muted); font-size: 12px;
      font-style: italic; line-height: 1.4; word-break: break-word;
      margin-bottom: 3px;
      text-align: left;
    }
    .tx-text {
      display: block; width: 100%;
      color: var(--vzn-subtitle-strong); font-size: 18px; font-weight: 600;
      text-align: left; line-height: 1.45;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-break: break-word;
      transition: color 0.2s, font-size 0.15s;
    }
    .tx-text.history {
      opacity: 0.45;
      font-size: 0.85em;
    }
    .source-text.history {
      opacity: 0.45;
    }
    .placeholder { color: var(--vzn-subtitle-soft); font-size: 13px; font-style: italic; text-align: left; }

    /* ── Style bar ───────────────────────────────────────────────────────────── */
    .style-bar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; height: 36px;
      background: var(--vzn-subtitle-chrome);
      border-top: 1px solid var(--vzn-subtitle-border);
      -webkit-app-region: no-drag;
    }
    .style-label { font-size: 10px; color: var(--vzn-subtitle-muted); white-space: nowrap; }
    input[type="color"] {
      -webkit-appearance: none; width: 20px; height: 20px;
      border: 1px solid var(--vzn-subtitle-border); border-radius: 4px;
      padding: 0; cursor: pointer; background: none; flex-shrink: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .slider-group { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    input[type="range"] {
      -webkit-appearance: none; flex: 1; min-width: 0; height: 3px;
      background: var(--vzn-subtitle-control-hover); border-radius: 2px;
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
      background: var(--vzn-subtitle-text); cursor: pointer;
    }
    input[type="range"]:hover::-webkit-slider-thumb { background: var(--vzn-subtitle-strong); }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- ── Handle bar ─────────────────────────────────────────────────────── -->
    <div class="handle">
      <span class="grip">⠿⠿</span>
      <span class="label">Subtitles · Viezan</span>
      <!-- Status badge -->
      <div class="status-badge stopped" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Stopped</span>
      </div>
      <button type="button" class="close-btn" id="closeBtn" title="Close">✕</button>
    </div>

    <!-- ── Controls row 1: Provider / Model / Start-Stop ──────────────────── -->
    <div class="controls">
      <!-- Custom provider dropdown with real SVG icons -->
      <div class="provider-dropdown" id="providerDropdown">
        <button type="button" class="provider-btn" id="providerBtn">
          <svg id="providerIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"></svg>
          <span id="providerName">Gemini</span>
          <span class="caret">▾</span>
        </button>
        <div class="provider-menu" id="providerMenu">
          <!--
            Provider icons use flat brand colors without gradients.
          -->
          <button type="button" class="provider-option" data-id="gemini">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 24A14.304 14.304 0 0 0 0 12 14.304 14.304 0 0 0 12 0a14.304 14.304 0 0 0 12 12 14.304 14.304 0 0 0-12 12Z" fill="#4285F4"/>
            </svg>
            Gemini
          </button>
          <button type="button" class="provider-option" data-id="claude">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#CC785C" aria-hidden="true">
              <path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128h-.23l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.448.255h.389l.054-.158-.133-.097-.103-.097-2.339-1.585-2.533-1.677-1.328-.965-.717-.487-.36-.456-.155-.992.645-.71.866.06.219.06.879.673 1.88 1.452 2.448 1.798.358.298.144-.103.018-.072-.16-.272-1.346-2.428-1.43-2.466-.638-1.025-.17-.616a2.948 2.948 0 0 1-.105-.722L1.51.39 2.045 0l1.296.073.426.054.674.616.99 2.265 1.605 3.566.249.495.13.456.05.14h.082V7.43L7.25 1.04l.067-.298.534-.182.535.255.225.503-.225 1.476-1.825 8.844.011.49.146.054.342-.121 1.413-1.91 2.351-2.95 1.044-1.18 1.225-1.302.781-.617h1.483l1.105 1.62-.495 1.673-1.546 1.97-1.281 1.659-1.83 2.466-1.146 1.96.106.158.275-.03 4.196-.91 2.265-.412 2.703-.467.91.42.105.43-.359.879-2.156.526-2.529.51-3.766.892-.045.04.05.057 1.69.157.722.043h1.766l3.291.245.86.575.515.687-.085.527-1.32.682-1.78-.42-4.165-.998-1.43-.358h-.197v.121l1.193 1.166 2.181 1.971 2.732 2.532.139.625-.349.49-.367-.054-2.379-1.798-.917-.81-2.082-1.755h-.139v.182l.482.71 2.539 3.808.13 1.166-.18.388-.658.224-.722-.133-1.486-2.078-1.532-2.345-1.236-2.114-.146.085-.732 7.876-.343.4-.793.298-.66-.504-.353-.815.353-1.616.421-2.111.343-1.679.31-2.084.18-.69-.012-.048-.146.018-1.5 2.062-2.282 3.083-1.81 1.937-.435.176-.755-.387.07-.687.418-.61 2.495-3.165 1.5-1.962.972-1.137-.006-.158h-.054L4.262 18.62l-1.788.225-.768-.061-.473-.557.06-.376.281-.297 2.336-1.605"/>
            </svg>
            Claude
          </button>
          <button type="button" class="provider-option" data-id="openai">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#10A37F" aria-hidden="true">
              <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.843-3.372L15.115 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08-4.774 2.758a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>
            </svg>
            OpenAI
          </button>
        </div>
      </div>
      <select id="modelSel" class="sel" title="Select Model"></select>
      <button type="button" id="startStopBtn" class="start-btn"><span id="startStopText">▶ Start</span></button>
      <button type="button" id="newSessionBtn" class="new-btn" title="New session"><span id="newSessionText">＋ New</span></button>
    </div>

    <!-- ── Controls row 2: Audio Mode / Target Language ───────────────────── -->
    <div class="controls2">
      <span class="ctrl-label" id="sourceLabel">Source</span>
      <div class="audio-group">
        <!-- MicrophoneIcon SVG from media.tsx -->
        <button type="button" class="audio-btn" data-mode="mic" title="Microphone">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/>
            <line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/>
          </svg>
          Mic
        </button>
        <!-- MonitorIcon SVG from media.tsx -->
        <button type="button" class="audio-btn active" data-mode="system" title="System Audio">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path stroke-linecap="round" d="M8 21h8M12 17v4"/>
          </svg>
          Sys
        </button>
        <!-- MicrophoneIcon + MonitorIcon combined -->
        <button type="button" class="audio-btn" data-mode="both" title="Mic + System">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/>
            <line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/>
          </svg>
          <span style="opacity:0.5;font-size:8px">+</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path stroke-linecap="round" d="M8 21h8M12 17v4"/>
          </svg>
        </button>
      </div>
      <span class="ctrl-label" id="translateToLabel">Translate to</span>
      <select id="langSel" class="lang-sel" title="Ngôn ngữ đích"></select>
    </div>

    <!-- ── Content area ───────────────────────────────────────────────────── -->
    <div class="body" id="body">
      <span class="placeholder" id="ph">Waiting for translation…</span>
      <div class="subtitle-list" id="subtitleList"></div>
    </div>

    <!-- ── Style bar ──────────────────────────────────────────────────────── -->

  <script>

    const PROVIDER_ICONS = {

      claude: `<path fill="#CC785C" d="M4.709 15.955l4.72-2.647.08-.23-.08-.128h-.23l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.448.255h.389l.054-.158-.133-.097-.103-.097-2.339-1.585-2.533-1.677-1.328-.965-.717-.487-.36-.456-.155-.992.645-.71.866.06.219.06.879.673 1.88 1.452 2.448 1.798.358.298.144-.103.018-.072-.16-.272-1.346-2.428-1.43-2.466-.638-1.025-.17-.616a2.948 2.948 0 0 1-.105-.722L1.51.39 2.045 0l1.296.073.426.054.674.616.99 2.265 1.605 3.566.249.495.13.456.05.14h.082V7.43L7.25 1.04l.067-.298.534-.182.535.255.225.503-.225 1.476-1.825 8.844.011.49.146.054.342-.121 1.413-1.91 2.351-2.95 1.044-1.18 1.225-1.302.781-.617h1.483l1.105 1.62-.495 1.673-1.546 1.97-1.281 1.659-1.83 2.466-1.146 1.96.106.158.275-.03 4.196-.91 2.265-.412 2.703-.467.91.42.105.43-.359.879-2.156.526-2.529.51-3.766.892-.045.04.05.057 1.69.157.722.043h1.766l3.291.245.86.575.515.687-.085.527-1.32.682-1.78-.42-4.165-.998-1.43-.358h-.197v.121l1.193 1.166 2.181 1.971 2.732 2.532.139.625-.349.49-.367-.054-2.379-1.798-.917-.81-2.082-1.755h-.139v.182l.482.71 2.539 3.808.13 1.166-.18.388-.658.224-.722-.133-1.486-2.078-1.532-2.345-1.236-2.114-.146.085-.732 7.876-.343.4-.793.298-.66-.504-.353-.815.353-1.616.421-2.111.343-1.679.31-2.084.18-.69-.012-.048-.146.018-1.5 2.062-2.282 3.083-1.81 1.937-.435.176-.755-.387.07-.687.418-.61 2.495-3.165 1.5-1.962.972-1.137-.006-.158h-.054L4.262 18.62l-1.788.225-.768-.061-.473-.557.06-.376.281-.297 2.336-1.605"/>`,
      openai: `<path fill="#10A37F" d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.843-3.372L15.115 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08-4.774 2.758a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>`,
    }
    const PROVIDER_NAMES = { gemini: 'Gemini', claude: 'Claude', openai: 'OpenAI' }

    // Fallback model lists
    const FALLBACK_MODELS = {
      gemini: [
        { id: 'gemini-2.5-flash-preview-04-17', name: '2.5 Flash' },
        { id: 'gemini-2.0-flash', name: '2.0 Flash' },
        { id: 'gemini-2.0-flash-lite', name: '2.0 Flash-Lite' },
        { id: 'gemini-1.5-flash', name: '1.5 Flash' },
        { id: 'gemini-1.5-pro', name: '1.5 Pro' },
      ],
      claude: [
        { id: 'claude-3-5-haiku-20241022', name: '3.5 Haiku' },
        { id: 'claude-3-5-sonnet-20241022', name: '3.5 Sonnet' },
        { id: 'claude-3-7-sonnet-20250219', name: '3.7 Sonnet' },
      ],
      openai: [
        { id: 'gpt-4o-mini', name: 'GPT-4o Mini' },
        { id: 'gpt-4o', name: 'GPT-4o' },
        { id: 'gpt-3.5-turbo', name: 'GPT-3.5' },
      ],
    }

    // Target languages
    const TARGET_LANGUAGES = [
      { code: 'vi',    name: 'Tiếng Việt' },
      { code: 'en',    name: 'English' },
      { code: 'zh',    name: '中文 (简体)' },
      { code: 'zh-TW', name: '繁體中文' },
      { code: 'ja',    name: '日本語' },
      { code: 'ko',    name: '한국어' },
      { code: 'fr',    name: 'Français' },
      { code: 'de',    name: 'Deutsch' },
      { code: 'es',    name: 'Español' },
      { code: 'pt',    name: 'Português' },
      { code: 'ru',    name: 'Русский' },
      { code: 'ar',    name: 'العربية' },
      { code: 'th',    name: 'ภาษาไทย' },
      { code: 'id',    name: 'Bahasa Indonesia' },
      { code: 'it',    name: 'Italiano' },
      { code: 'nl',    name: 'Nederlands' },
      { code: 'pl',    name: 'Polski' },
      { code: 'tr',    name: 'Türkçe' },
      { code: 'hi',    name: 'हिंदी' },
    ]

    // ── i18n strings ─────────────────────────────────────────────────────────
    let currentLocale = 'en'
    const STRINGS = {
      vi: {
        stopped: 'Đã dừng', listening: 'Đang nghe', transcribing: 'Nhận diện…', translating: 'Đang dịch…',
        start: '▶ Bắt đầu', stop: '⏹ Dừng', newSession: '＋ Mới', newSessionTitle: 'Phiên mới',
        source: 'Nguồn', translateTo: 'Dịch sang', waiting: 'Chờ bản dịch…', pending: 'Đang dịch…',
        color: 'Màu', opacity: 'Mờ', close: 'Đóng', selectModel: 'Chọn Model',
        colorTitle: 'Màu chữ', opacityTitle: 'Độ mờ nền', fontSizeTitle: 'Cỡ chữ',
      },
      en: {
        stopped: 'Stopped', listening: 'Listening', transcribing: 'Transcribing…', translating: 'Translating…',
        start: '▶ Start', stop: '⏹ Stop', newSession: '＋ New', newSessionTitle: 'New session',
        source: 'Source', translateTo: 'Translate to', waiting: 'Waiting for translation…', pending: 'Translating…',
        color: 'Color', opacity: 'Opacity', close: 'Close', selectModel: 'Select Model',
        colorTitle: 'Text color', opacityTitle: 'Background opacity', fontSizeTitle: 'Font size',
      },
      ja: {
        stopped: '停止中', listening: '聞き取り中', transcribing: '認識中…', translating: '翻訳中…',
        start: '▶ 開始', stop: '⏹ 停止', newSession: '＋ 新規', newSessionTitle: '新規セッション',
        source: 'ソース', translateTo: '翻訳先', waiting: '翻訳待ち…', pending: '翻訳中…',
        color: '色', opacity: '透明度', close: '閉じる', selectModel: 'モデル選択',
        colorTitle: '文字色', opacityTitle: '背景の透明度', fontSizeTitle: '文字サイズ',
      },
    }
    function S(key) {
      return (STRINGS[currentLocale] ?? STRINGS.en)[key] ?? (STRINGS.en)[key]
    }
    function applyLocale(locale) {
      if (!locale) return
      currentLocale = locale
      document.getElementById('sourceLabel').textContent     = S('source')
      document.getElementById('translateToLabel').textContent = S('translateTo')
      document.getElementById('colorLabel').textContent      = S('color')
      document.getElementById('opacityLabel').textContent    = S('opacity')
      document.getElementById('startStopText').textContent   = isSessionActive ? S('stop') : S('start')
      document.getElementById('newSessionText').textContent  = S('newSession')
      document.getElementById('closeBtn').title              = S('close')
      document.getElementById('modelSel').title              = S('selectModel')
      document.getElementById('newSessionBtn').title         = S('newSessionTitle')
      document.getElementById('colorPicker').title           = S('colorTitle')
      document.getElementById('opacitySlider').title         = S('opacityTitle')
      document.getElementById('fontSizeSlider').title        = S('fontSizeTitle')
      // Update placeholder if visible
      const phEl = document.getElementById('ph')
      if (phEl && phEl.style.display !== 'none') phEl.textContent = S('waiting')
    }

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const closeBtn      = document.getElementById('closeBtn')
    const providerBtn   = document.getElementById('providerBtn')
    const providerIcon  = document.getElementById('providerIcon')
    const providerName  = document.getElementById('providerName')
    const providerMenu  = document.getElementById('providerMenu')
    const modelSel      = document.getElementById('modelSel')
    const startStopBtn  = document.getElementById('startStopBtn')
    const langSel       = document.getElementById('langSel')
    const statusBadge   = document.getElementById('statusBadge')
    const statusText    = document.getElementById('statusText')
    const ph            = document.getElementById('ph')
    const subtitleList  = document.getElementById('subtitleList')
    const body          = document.getElementById('body')
    const colorPicker   = document.getElementById('colorPicker')
    const opacitySlider = document.getElementById('opacitySlider')
    const fontSizeSlider= document.getElementById('fontSizeSlider')
    const audioBtns     = document.querySelectorAll('.audio-btn')

    // ── State ─────────────────────────────────────────────────────────────────
    let currentProvider        = 'gemini'
    let isSessionActive        = false
    let streamText             = ''
    let lastFinalizedText      = ''    // text of the last completed entry (for dedup)
    let isStreaming            = false // true between onStreamStart and onStreamEnd
    // ── Per-segment entry tracking ────────────────────────────────────────────
    // entriesBySegId: segId → { entry, srcEl, txEl }
    // Entries are created IMMEDIATELY when source text arrives, before translation.
    const entriesBySegId        = {}
    // activeStreams: stream key → { entryData, text, segId }. Streams are keyed by
    // segId so overlapping segments never write into each other's line. A stream
    // started without a segId uses the legacy key ''.
    const activeStreams         = {}
    const pendingTranslationQueue = []   // ordered segIds waiting for non-streaming translation

    // ── Populate language dropdown ─────────────────────────────────────────────
    TARGET_LANGUAGES.forEach(l => {
      const opt = document.createElement('option')
      opt.value = l.code; opt.textContent = l.name
      langSel.appendChild(opt)
    })
    langSel.value = 'vi'

    // ── Status badge ──────────────────────────────────────────────────────────
    function updateStatus(isActive, isTranscribing, isTranslating) {
      statusBadge.className = 'status-badge'
      if (!isActive) {
        statusBadge.classList.add('stopped')
        statusText.textContent = S('stopped')
      } else if (isTranslating) {
        statusBadge.classList.add('translating')
        statusText.textContent = S('translating')
      } else if (isTranscribing) {
        statusBadge.classList.add('transcribing')
        statusText.textContent = S('transcribing')
      } else {
        statusBadge.classList.add('listening')
        statusText.textContent = S('listening')
      }
    }

    // ── Provider helpers ───────────────────────────────────────────────────────
    function setProviderUI(id) {
      currentProvider = id
      providerIcon.innerHTML = PROVIDER_ICONS[id] ?? ''
      providerName.textContent = PROVIDER_NAMES[id] ?? id
      document.querySelectorAll('.provider-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id)
      })
    }
    function populateModels(models, selectedId) {
      const list = models && models.length > 0 ? models : (FALLBACK_MODELS[currentProvider] ?? [])
      modelSel.innerHTML = ''
      list.forEach(m => {
        const opt = document.createElement('option')
        opt.value = m.id; opt.textContent = m.name ?? m.id
        modelSel.appendChild(opt)
      })
      if (selectedId) {
        modelSel.value = selectedId
        if (!modelSel.value && list.length > 0) modelSel.value = list[0].id
      }
    }

    setProviderUI('gemini')
    populateModels(null, null)

    // ── Provider dropdown ──────────────────────────────────────────────────────
    providerBtn.onclick = (e) => { e.stopPropagation(); providerMenu.classList.toggle('open') }
    document.addEventListener('click', () => providerMenu.classList.remove('open'))
    providerMenu.addEventListener('click', e => e.stopPropagation())
    document.querySelectorAll('.provider-option').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id
        setProviderUI(id); populateModels(null, null)
        providerMenu.classList.remove('open')
        window.subtitleAPI.emitSetProvider(id)
        if (modelSel.value) window.subtitleAPI.emitSetModel(modelSel.value)
      }
    })

    modelSel.onchange = () => window.subtitleAPI.emitSetModel(modelSel.value)

    // ── Audio mode ─────────────────────────────────────────────────────────────
    function setAudioModeUI(mode) {
      audioBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode)
      })
    }
    audioBtns.forEach(btn => {
      btn.onclick = () => { setAudioModeUI(btn.dataset.mode); window.subtitleAPI.emitSetAudioMode(btn.dataset.mode) }
    })

    langSel.onchange = () => window.subtitleAPI.emitSetTargetLang(langSel.value)

    // ── Start / Stop ───────────────────────────────────────────────────────────
    startStopBtn.onclick = () => {
      if (isSessionActive) window.subtitleAPI.emitStop()
      else window.subtitleAPI.emitStart()
    }
    function updateStartStopBtn() {
      document.getElementById('startStopText').textContent = isSessionActive ? S('stop') : S('start')
      startStopBtn.classList.toggle('active', isSessionActive)
    }

    closeBtn.onclick = () => window.subtitleAPI.close()

    // ── New session / clear ─────────────────────────────────────────────────────
    function clearSubtitleList() {
      subtitleList.innerHTML = ''
      // Clear all segment tracking state
      for (const k of Object.keys(entriesBySegId)) delete entriesBySegId[k]
      pendingTranslationQueue.length = 0
      for (const k of Object.keys(activeStreams)) delete activeStreams[k]
      lastFinalizedText  = ''
      streamText         = ''
      isStreaming        = false
      ph.style.display   = 'block'
      ph.textContent     = S('waiting')
    }
    document.getElementById('newSessionBtn').onclick = () => {
      window.subtitleAPI.emitClear()   // → handleNewSession: save to history then reset
      clearSubtitleList()              // clear subtitle window display
    }

    // ── Text helpers ───────────────────────────────────────────────────────────
    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    function scrollToBottom() {
      body.scrollTop = body.scrollHeight
    }

    function trimHistory() {
      // Keep ALL entries — user can scroll up to see history.
      // Mark all but the LAST entry as dimmed history.
      const all = subtitleList.querySelectorAll('.subtitle-entry')
      all.forEach((entry, i) => {
        const isLast = i === all.length - 1
        entry.querySelectorAll('.tx-text').forEach(el => {
          el.classList.toggle('history', !isLast)
        })
        entry.querySelectorAll('.source-text').forEach(el => {
          el.classList.toggle('history', !isLast)
        })
      })
    }

    /**
     * Create a subtitle entry immediately when source text arrives.
     * Shows the source text above and a "Đang dịch…" placeholder below.
     * Registers the entry in entriesBySegId for later translation fill-in.
     */
    function createEntryForSeg(sourceText, segId) {
      const entry = document.createElement('div')
      entry.className = 'subtitle-entry'

      const srcEl = document.createElement('div')
      srcEl.className = 'source-text'
      if (sourceText) {
        srcEl.textContent = sourceText
        srcEl.style.display = 'block'
      }

      const txEl = document.createElement('div')
      txEl.className = 'tx-text'
      txEl.style.color = colorPicker.value
      txEl.style.fontSize = `${fontSizeSlider.value}px`
      // Show placeholder while waiting for translation
      txEl.style.opacity = '0.35'
      txEl.textContent = S('pending')

      entry.appendChild(srcEl)
      entry.appendChild(txEl)
      subtitleList.appendChild(entry)

      const entryData = { entry, srcEl, txEl }
      if (segId) {
        entriesBySegId[segId] = entryData
        pendingTranslationQueue.push(segId)
      }

      ph.style.display = 'none'
      trimHistory()
      scrollToBottom()
      return entryData
    }

    // ── Style helpers ──────────────────────────────────────────────────────────
    function applyStyle({ textColor, fontSize, bgOpacity }) {
      // Apply color & size to ALL entries (current + history)
      subtitleList.querySelectorAll('.tx-text').forEach(el => {
        el.style.color = textColor
        el.style.fontSize = `${fontSize}px`
      })
      body.style.background = `rgba(0,0,0,${(bgOpacity/100).toFixed(2)})`
      colorPicker.value = textColor; fontSizeSlider.value = fontSize; opacitySlider.value = bgOpacity
    }
    let styleTimer = null
    function emitStyle() {
      clearTimeout(styleTimer)
      styleTimer = setTimeout(() => {
        const s = { textColor: colorPicker.value, fontSize: Number(fontSizeSlider.value), bgOpacity: Number(opacitySlider.value) }
        applyStyle(s); window.subtitleAPI.emitStyleUpdate(s)
      }, 80)
    }
    colorPicker.oninput = opacitySlider.oninput = fontSizeSlider.oninput = emitStyle

    // ── IPC listeners ──────────────────────────────────────────────────────────

    window.subtitleAPI.onState(({ selectedProvider, selectedModel, isActive, isTranscribing, isTranslating, availableModels, audioMode, targetLang, locale }) => {
      if (locale) applyLocale(locale)
      if (selectedProvider !== currentProvider) setProviderUI(selectedProvider)
      populateModels(availableModels, selectedModel)
      setAudioModeUI(audioMode || 'system')
      if (targetLang && langSel.value !== targetLang) langSel.value = targetLang
      isSessionActive = isActive
      updateStartStopBtn()
      updateStatus(isActive, isTranscribing, isTranslating)
    })

    // Source text arrives BEFORE translation starts → create entry immediately with placeholder
    window.subtitleAPI.onSourceText(({ text, segId }) => {
      if (!text) return
      createEntryForSeg(text, segId)
    })

    window.subtitleAPI.onStyle((style) => applyStyle(style))

    // ── Overlap deduplication ──────────────────────────────────────────────────
    function stripOverlap(prev, curr) {
      if (!prev || !curr) return curr
      const p = prev.trim()
      const c = curr.trim()

      // Case 1: new text is a pure duplicate (or subset) of the previous entry
      if (p === c || p.includes(c)) return null   // null = discard

      // Case 2: new text STARTS WITH the entire previous entry
      // (e.g. prev = "Bạn cần gọi cho ai?" and curr = "Bạn cần gọi cho ai? Tôi cần…")
      // Also handle joined-without-space: "Prev sentence.Next sentence"
      if (c.startsWith(p)) {
        const remainder = c.substring(p.length).replace(/^[\s,.!?。！？]+/, '').trim()
        return remainder || null   // null if nothing meaningful remains
      }

      // Case 2b: joined without space — prev ends with a word and curr starts with it
      // e.g. prev = "...gọi cho ai?" curr = "gọi cho ai?Tôi cần..."
      const pNoPunct = p.replace(/[,.!?。！？\s]+$/, '')
      if (pNoPunct.length >= 8 && c.startsWith(pNoPunct)) {
        const remainder = c.substring(pNoPunct.length).replace(/^[\s,.!?。！？]+/, '').trim()
        return remainder || null
      }

      // Case 3: partial suffix-of-prev is a prefix-of-curr (sliding window overlap)
      // Try progressively shorter suffixes of prev (min 8 chars to avoid false positives)
      const minLen = Math.max(8, Math.floor(p.length * 0.25))
      for (let len = Math.min(p.length, c.length); len >= minLen; len--) {
        const suffix = p.slice(-len)
        if (c.startsWith(suffix)) {
          const remainder = c.substring(len).replace(/^[\s,.!?。！？]+/, '').trim()
          return remainder || null
        }
      }

      return curr   // no overlap — keep as-is
    }

    // Streaming
    // ── Streaming path ─────────────────────────────────────────────────────────
    const streamKey = (segId) => segId || ''

    window.subtitleAPI.onStreamStart(({ segId } = {}) => {
      const key = streamKey(segId)

      // Find the entry pre-created by onSourceText; fall back to creating a new one
      let entryData = segId ? entriesBySegId[segId] : null
      if (!entryData) {
        // onSourceText hasn't arrived yet — create entry now without source text
        entryData = createEntryForSeg('', segId)
      }
      entryData.txEl.textContent = ''      // clear placeholder
      entryData.txEl.style.opacity = '1'

      activeStreams[key] = { entryData, text: '', segId: segId || null }
      isStreaming = true
      streamText = ''
    })

    // `segId` identifies the stream the token belongs to; tokens for one segment
    // never append to another segment's line.
    window.subtitleAPI.onStreamToken((token, segId) => {
      const stream = activeStreams[streamKey(segId)]
      if (!stream) return
      stream.text += token
      streamText = stream.text
      stream.entryData.txEl.innerHTML = escHtml(stream.text)
      scrollToBottom()
    })

    window.subtitleAPI.onStreamEnd(({ segId } = {}) => {
      const key = streamKey(segId)
      const stream = activeStreams[key]
      delete activeStreams[key]
      isStreaming = Object.keys(activeStreams).length > 0
      if (!stream) return

      const deduped = stripOverlap(lastFinalizedText, stream.text)
      if (deduped === null) {
        // Pure duplicate — remove entry
        if (stream.entryData.entry.parentNode === subtitleList) {
          subtitleList.removeChild(stream.entryData.entry)
        }
        if (stream.segId) delete entriesBySegId[stream.segId]
      } else {
        if (deduped !== stream.text) {
          stream.entryData.txEl.innerHTML = escHtml(deduped)
        }
        stream.entryData.txEl.style.opacity = '1'
        lastFinalizedText = deduped
      }

      // Remove from pending queue
      const idx = pendingTranslationQueue.indexOf(stream.segId)
      if (idx !== -1) pendingTranslationQueue.splice(idx, 1)

      trimHistory()
    })

    // ── Non-streaming fallback ─────────────────────────────────────────────────
    // Fired by the latestSubtitle useEffect in React. Ignored when streaming is active.
    // When streaming fails/isn't used, fills the oldest pending entry's translation.
    window.subtitleAPI.onText(({ text, isTranslating }) => {
      if (isStreaming) return   // stream handles its own entry — ignore
      if (!text) return

      streamText = text

      // Find the oldest entry waiting for a translation
      const oldestSegId = pendingTranslationQueue[0] || null
      const entryData   = oldestSegId ? entriesBySegId[oldestSegId] : null

      if (entryData) {
        const deduped = stripOverlap(lastFinalizedText, text)
        if (deduped === null) {
          subtitleList.removeChild(entryData.entry)
          delete entriesBySegId[oldestSegId]
          pendingTranslationQueue.shift()
        } else {
          entryData.txEl.innerHTML = escHtml(deduped)
          entryData.txEl.style.opacity = '1'
          lastFinalizedText = deduped
          if (!isTranslating) {
            pendingTranslationQueue.shift()
            trimHistory()
          }
        }
      } else {
        // No pending entry — this is a stale latestSubtitle update, ignore
      }
    })
  </script>
</body>
</html>
