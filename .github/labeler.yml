# Cấu hình cho actions/labeler@v5
# Tự động gán nhãn theo path file thay đổi trong PR.

"area/native":
    - changed-files:
          - any-glob-to-any-file:
                - apps/**
                - native/**
                - contracts/**

"area/design-assets":
    - changed-files:
          - any-glob-to-any-file:
                - src/**

"area/chrome-extension":
    - changed-files:
          - any-glob-to-any-file:
                - chrome-extension/**

"area/build":
    - changed-files:
          - any-glob-to-any-file:
                - build/**
                - apps/packaging/**
                - scripts/**

"area/ci":
    - changed-files:
          - any-glob-to-any-file:
                - .github/workflows/**
                - .github/labeler.yml
                - .github/dependabot.yml

"area/docs":
    - changed-files:
          - any-glob-to-any-file:
                - "**/*.md"
                - docs/**

"area/tests":
    - changed-files:
          - any-glob-to-any-file:
                - "**/__tests__/**"
                - "**/*.test.ts"
                - "**/*.test.tsx"
                - apps/macos/Tests/**
                - apps/desktop-qt/tests/**

"area/dependencies":
    - changed-files:
          - any-glob-to-any-file:
                - package.json
                - package-lock.json

"area/agent":
    - changed-files:
          - any-glob-to-any-file:
                - viezanagent/**
