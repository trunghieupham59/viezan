name: CodeQL

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        # Quét toàn bộ repo định kỳ mỗi tuần (Thứ 2, 03:00 UTC)
        - cron: "0 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

# Trên branch mặc định / lịch chạy định kỳ KHÔNG hủy run đang chạy để tránh
# mất kết quả SARIF của code scanning. Chỉ hủy với PR / branch khác.
concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none
                    - language: c-cpp
                      build-mode: manual

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Không cần extractor JS/TS quét submodule (viezanagent) – submodule
                  # có repo + workflow CodeQL riêng.
                  submodules: false

            - uses: actions/setup-python@v6
              if: matrix.language == 'c-cpp'
              with:
                  python-version: '3.12'
            - name: Install Qt build dependencies
              if: matrix.language == 'c-cpp'
              run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0
            - uses: jurplel/install-qt-action@v4
              if: matrix.language == 'c-cpp'
              with:
                  version: '6.8.3'
                  modules: 'qtmultimedia qtspeech qtwebsockets'
                  cache: true

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality
                  config: |
                      paths-ignore:
                        - "**/node_modules/**"
                        - "**/dist/**"
                        - "**/build/**"
                        - "**/coverage/**"
                        - "**/*.min.js"
                        - "**/*.bundle.js"
                        - "**/*.bundle.min.js"
                        - "docs/**"
                        - "public/vad/**"
                        - "build/**"
                        - "viezanagent/**"
                        - "chrome-extension/icons/**"

            - name: Build native Qt for analysis
              if: matrix.language == 'c-cpp'
              run: |
                  cmake -S apps/desktop-qt -B .native-build/codeql -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
                  cmake --build .native-build/codeql --parallel 2

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"
