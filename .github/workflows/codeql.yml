name: CodeQL

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        # Quét toàn bộ repo định kỳ mỗi tuần (Thứ 2, 03:00 UTC)
        - cron: "0 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    actions: read

# Trên branch mặc định / lịch chạy định kỳ KHÔNG hủy run đang chạy để tránh
# mất kết quả SARIF của code scanning. Chỉ hủy với PR / branch khác.
concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      build-mode: none

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Không cần extractor JS/TS quét submodule (viezanagent) – submodule
                  # có repo + workflow CodeQL riêng.
                  submodules: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality
                  config: |
                      paths-ignore:
                        - "**/node_modules/**"
                        - "**/dist/**"
                        - "**/build/**"
                        - "**/coverage/**"
                        - "**/*.min.js"
                        - "**/*.bundle.js"
                        - "**/*.bundle.min.js"
                        - "docs/**"
                        - "public/vad/**"
                        - "build/**"
                        - "viezanagent/**"
                        - "chrome-extension/icons/**"

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"
