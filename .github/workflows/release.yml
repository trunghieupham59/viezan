name: Package Native Release
# Signing machines are deliberately provisioned outside this workflow. No signing
# keys are downloaded to hosted runners; artifacts are uploaded for review only.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [macos-arm64, macos-x64, windows-x64, linux-x64]
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, native-release, '${{ inputs.platform }}']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and package using provisioned native tools
        run: python scripts/native/release.py
        env:
          VIEZAN_PATCHED_RUNTIME: ${{ vars.VIEZAN_PATCHED_RUNTIME }}
          VIEZAN_QT_BIN: ${{ vars.VIEZAN_QT_BIN }}
          VIEZAN_SIGNING_IDENTITY: ${{ vars.VIEZAN_SIGNING_IDENTITY }}
          VIEZAN_NOTARY_PROFILE: ${{ vars.VIEZAN_NOTARY_PROFILE }}
          VIEZAN_CERTIFICATE_THUMBPRINT: ${{ vars.VIEZAN_CERTIFICATE_THUMBPRINT }}
          VIEZAN_LINUXDEPLOY: ${{ vars.VIEZAN_LINUXDEPLOY }}
      - uses: actions/upload-artifact@v7
        with:
          name: Viezan-${{ inputs.platform }}
          path: |
            .native-packages/*.dmg
            .native-packages/*.zip
            .native-packages/*.exe
            .native-packages/*.AppImage
            .native-packages/*.json
          if-no-files-found: error
