name: Release Production

on:
    push:
        tags:
            - "v*"
    # Chạy từ auto-tag.yml với --ref <tag> (GITHUB_REF vẫn là refs/tags/vX.Y.Z)
    workflow_dispatch:

permissions:
    contents: write
    id-token: write # Required for SignPath

jobs:
    create-release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            # Gate every path (tag push and workflow_dispatch) before creating a
            # public release. All packaging/upload jobs depend on this job.
            - name: Verify reviewed version and documentation
              uses: ./.github/actions/sync-version

            - name: Test documentation guard
              run: npm run test:docs

            - name: Prepare curated release notes
              shell: bash
              run: |
                  node scripts/readme-docs.mjs notes > "$RUNNER_TEMP/viezan-release-notes.md"
                  cat >> "$RUNNER_TEMP/viezan-release-notes.md" <<'NOTES'

                  ## Installation

                  Download the installer for your platform from the assets below.
                  See the [README](https://github.com/trunghieupham59/Viezan/blob/${{ github.ref_name }}/README.md#getting-started)
                  for setup instructions and platform limitations.
                  NOTES

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  name: "Viezan ${{ github.ref_name }}"
                  body_path: ${{ runner.temp }}/viezan-release-notes.md
                  draft: false
                  prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ─────────────────────────────────────────────
    # macOS build — Apple Silicon
    # ─────────────────────────────────────────────
    build-mac-arm64:
        needs: create-release
        runs-on: macos-15

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Verify reviewed version matches tag
              uses: ./.github/actions/sync-version

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build and publish (macOS arm64)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '' }}
              run: npx electron-builder --mac --arm64 --publish always

    # ─────────────────────────────────────────────
    # macOS build — Intel (x64)
    # ─────────────────────────────────────────────
    build-mac-intel:
        needs: create-release
        # macos-13 was retired by GitHub Actions; macos-15-intel is the
        # supported x86_64 runner label for standard hosted runners.
        runs-on: macos-15-intel

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Verify reviewed version matches tag
              uses: ./.github/actions/sync-version

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build and publish (macOS x64)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '' }}
              run: npx electron-builder --mac --x64 --publish always

    # ─────────────────────────────────────────────
    # Windows build → SignPath signing (free for OSS)
    # By default signing is optional: without the SignPath secrets, or when
    # signing fails, the unsigned installer is uploaded instead. Set the repo
    # variable REQUIRE_WINDOWS_SIGNING=true to make signing mandatory (the
    # release job then fails rather than shipping an unsigned installer).
    #
    # Set up SignPath to get a trusted signature:
    #   1. Register at https://signpath.io → "Open Source" free plan
    #   2. Link your GitHub repo in SignPath project settings
    #   3. Create a project, a signing policy and an artifact configuration
    #      (build/signpath-artifact-config.xml). Their slugs default to
    #      "tre-assistant" / "release-signing" / "windows-installer"; override
    #      with the repo variables SIGNPATH_PROJECT_SLUG,
    #      SIGNPATH_SIGNING_POLICY_SLUG and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG.
    #   4. Add SIGNPATH_API_TOKEN as a repo secret, SIGNPATH_ORGANIZATION_ID as a repo variable
    # ─────────────────────────────────────────────
    build-windows:
        needs: create-release
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Verify reviewed version matches tag
              uses: ./.github/actions/sync-version

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Stage verified Windows Ollama runtime
              uses: ./.github/actions/stage-ollama-runtime

            - name: Build unsigned Windows installer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  WIN_CSC_LINK: ""
                  WIN_CSC_KEY_PASSWORD: ""
              run: npx electron-builder --win nsis --x64 --publish never

            - name: Locate unsigned installer & app files
              id: find_installer
              shell: bash
              run: |
                  INSTALLER=$(ls release/*.exe | head -n 1)
                  echo "INSTALLER_PATH=$INSTALLER" >> "$GITHUB_OUTPUT"
                  echo "INSTALLER_NAME=$(basename $INSTALLER)" >> "$GITHUB_OUTPUT"
                  echo "Found installer: $INSTALLER"

            - name: Check if SignPath secrets are configured
              id: check_signpath
              shell: bash
              run: |
                  if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORG_ID" ]; then
                    echo "ENABLED=true" >> "$GITHUB_OUTPUT"
                    echo "SignPath secrets found — will attempt signing."
                  else
                    if [ "$REQUIRE_SIGNING" = "true" ]; then
                      echo "::error::REQUIRE_WINDOWS_SIGNING is true but SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID are not configured."
                      exit 1
                    fi
                    echo "ENABLED=false" >> "$GITHUB_OUTPUT"
                    echo "SignPath secrets not configured — will upload unsigned installer."
                  fi
              env:
                  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN || '' }}
                  SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || '' }}
                  REQUIRE_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING || 'false' }}

            # ── SignPath signing (only when secrets are configured) ──────
            - name: Package installer + app PE files into ZIP for SignPath
              if: steps.check_signpath.outputs.ENABLED == 'true'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path signing-input | Out-Null
                  Copy-Item release\*.exe signing-input\
                  if (Test-Path release\win-unpacked) {
                    Get-ChildItem -Path release\win-unpacked -Filter *.exe | Copy-Item -Destination signing-input\
                    Get-ChildItem -Path release\win-unpacked -Filter *.dll | Copy-Item -Destination signing-input\
                    Write-Host "Copied PE files:"
                    Get-ChildItem signing-input | Select-Object Name
                  }
                  Push-Location signing-input
                  Compress-Archive -Path * -DestinationPath ..\unsigned-bundle.zip -Force
                  Pop-Location
                  $size = (Get-Item unsigned-bundle.zip).Length / 1MB
                  Write-Host "Bundle size: $([math]::Round($size, 2)) MB"

            - name: Upload unsigned bundle as workflow artifact
              id: upload_unsigned
              if: steps.check_signpath.outputs.ENABLED == 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: unsigned-windows-bundle
                  path: unsigned-bundle.zip
                  retention-days: 1

            - name: Sign bundle via SignPath.io
              id: sign
              if: steps.check_signpath.outputs.ENABLED == 'true'
              # Optional signing keeps going on failure (unsigned fallback below);
              # mandatory signing (REQUIRE_WINDOWS_SIGNING) fails the job instead.
              continue-on-error: ${{ vars.REQUIRE_WINDOWS_SIGNING != 'true' }}
              uses: signpath/github-action-submit-signing-request@v3
              with:
                  api-token: "${{ secrets.SIGNPATH_API_TOKEN || '' }}"
                  organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID || '' }}"
                  project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG || 'tre-assistant' }}"
                  signing-policy-slug: "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}"
                  artifact-configuration-slug: "${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installer' }}"
                  github-artifact-id: "${{ steps.upload_unsigned.outputs.artifact-id }}"
                  wait-for-completion: true
                  output-artifact-directory: "release-signed"

            - name: Extract signed installer and upload to GitHub Release
              if: steps.check_signpath.outputs.ENABLED == 'true' && steps.sign.outcome == 'success'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  cd release-signed
                  SIGNED_ZIP=$(ls *.zip | head -n 1)
                  unzip -o "$SIGNED_ZIP" -d unpacked-signed
                  INSTALLER_NAME="${{ steps.find_installer.outputs.INSTALLER_NAME }}"
                  # The bundle also holds the signed app PE files; pick the installer by name.
                  SIGNED_EXE="unpacked-signed/${INSTALLER_NAME}"
                  if [ ! -f "$SIGNED_EXE" ]; then
                    echo "::error::Signed installer ${INSTALLER_NAME} not found in the SignPath output."
                    ls unpacked-signed
                    exit 1
                  fi
                  cd ..
                  # Upload under the ORIGINAL name: latest.yml points at it, so a renamed
                  # asset would make in-app updates 404.
                  echo "Uploading signed: ${INSTALLER_NAME}"
                  gh release upload "$TAG" "release-signed/${SIGNED_EXE}" --clobber
                  # Signing changed the file, so refresh the checksum electron-updater verifies.
                  node scripts/update-latest-yml.mjs release/latest.yml "release-signed/${SIGNED_EXE}"

            # ── Fallback: upload unsigned when SignPath is not configured or failed ──
            - name: Upload unsigned installer to GitHub Release (fallback)
              if: steps.check_signpath.outputs.ENABLED == 'false' || steps.sign.outcome == 'failure' || steps.sign.outcome == 'skipped'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  INSTALLER="${{ steps.find_installer.outputs.INSTALLER_PATH }}"
                  INSTALLER_NAME="${{ steps.find_installer.outputs.INSTALLER_NAME }}"
                  echo "Uploading unsigned: $INSTALLER_NAME"
                  gh release upload "$TAG" "$INSTALLER" --clobber

            # ── Upload latest.yml so electron-updater can find the correct Windows installer ──
            - name: Upload latest.yml to GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  if [ -f "release/latest.yml" ]; then
                    echo "Uploading latest.yml"
                    gh release upload "$TAG" "release/latest.yml" --clobber
                  else
                    echo "latest.yml not found in release/, skipping"
                  fi

    # ─────────────────────────────────────────────
    # Linux build
    # ─────────────────────────────────────────────
    build-linux:
        needs: create-release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux build deps
              uses: ./.github/actions/install-linux-deps

            - name: Verify reviewed version matches tag
              uses: ./.github/actions/sync-version

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build and publish (Linux)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --linux --publish always

    # ─────────────────────────────────────────────
    # Chrome Extension build
    # ─────────────────────────────────────────────
    build-chrome-extension:
        needs: create-release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Package Chrome Extension as ZIP
              shell: bash
              run: |
                  EXTENSION_ZIP="viezan-chrome-extension.zip"
                  rm -rf extension-package "$EXTENSION_ZIP"
                  mkdir -p extension-package

                  cp -R chrome-extension extension-package/chrome-extension
                  find extension-package/chrome-extension -type f \( \
                    -name "*.pem" -o \
                    -name "*.key" -o \
                    -name "*.p12" -o \
                    -name "*.pfx" \
                  \) -delete

                  node -e "JSON.parse(require('fs').readFileSync('extension-package/chrome-extension/manifest.json', 'utf8'))"

                  (
                    cd extension-package
                    zip -r "../$EXTENSION_ZIP" chrome-extension -x "*/.DS_Store" "*/Thumbs.db"
                  )

                  unzip -l "$EXTENSION_ZIP"
                  echo "Chrome extension ZIP packaged: $(du -sh "$EXTENSION_ZIP" | cut -f1)"

            - name: Upload Chrome Extension to GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  echo "Uploading Chrome extension to release $TAG"
                  gh release upload "$TAG" viezan-chrome-extension.zip --clobber
