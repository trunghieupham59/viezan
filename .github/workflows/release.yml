name: Package Native Release
# Builds every platform on GitHub-hosted runners and attaches the packages to a
# GitHub Release. Runs from develop publish the release and create its tag;
# runs from any other ref only prepare a draft.
#
# macOS produces notarized distribution packages or manual-install Preview DMGs.
# Windows signing optionally uses WINDOWS_DEV_CERT_PFX / WINDOWS_DEV_CERT_PASSWORD.
#
# Updates are trusted through Viezan's own key instead: VIEZAN_UPDATE_SIGNING_KEY
# (Ed25519 private key, PEM) signs each package manifest, and the apps check that
# signature against the public key they embed before installing an update.
#
# Runs automatically when a push to develop changes the version in package.json,
# and on demand. Other package.json edits (dependency bumps) do not build.
on:
  push:
    branches: [develop]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      preview_only:
        description: Build and test just the two internal macOS Preview DMGs as workflow artifacts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      targets: ${{ steps.targets.outputs.matrix }}
      macos_mode: ${{ steps.macos.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Build only when the version changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BEFORE"
          old="$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          new="$(node -p "require('./package.json').version")"
          echo "Version before: $old, after: $new"
          if [ "$old" = "$new" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select package targets
        id: targets
        if: steps.check.outputs.build == 'true'
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only || false }}
          TARGETS: >-
            [{"platform":"macos-arm64","arch":"arm64","os":"macos-15"},
             {"platform":"macos-x64","arch":"x64","os":"macos-15-intel"},
             {"platform":"windows-x64","os":"windows-latest"},
             {"platform":"linux-x64","os":"ubuntu-22.04"}]
        run: |
          matrix="$(jq -c --arg preview "$PREVIEW_ONLY" '[.[] | select($preview != "true" or (.platform | startswith("macos-")))]' <<< "$TARGETS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Select the macOS signing mode
        id: macos
        if: steps.check.outputs.build == 'true'
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only || false }}
          HAS_CERT: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' }}
          HAS_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD != '' }}
          HAS_PREVIEW_CERT: ${{ secrets.MACOS_PREVIEW_DEVELOPMENT_P12 != '' }}
          HAS_PREVIEW_PASSWORD: ${{ secrets.MACOS_PREVIEW_DEVELOPMENT_PASSWORD != '' }}
        run: |
          if [[ "$PREVIEW_ONLY" == true || ( "$HAS_CERT" == false && "$HAS_PASSWORD" == false ) ]]; then
            if [[ "$PREVIEW_ONLY" != true && "$GITHUB_REF" == refs/heads/develop ]]; then
              echo "::error::A public release needs notarized macOS update DMGs. Configure the Developer ID certificate and password, or build a Preview on a draft branch."
              exit 1
            fi
            if [[ "$HAS_PREVIEW_CERT" != true || "$HAS_PREVIEW_PASSWORD" != true ]]; then
              echo "::error::Internal Previews require the pinned Apple Development identity and its password."
              exit 1
            fi
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_CERT" == true && "$HAS_PASSWORD" == true ]]; then
            echo "mode=distribution" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The Developer ID certificate and its password must be configured together."
            exit 1
          fi

  package:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # macOS (SwiftUI) ---------------------------------------------------
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.platform == 'macos-arm64' && '26.3' || 'latest-stable' }}
      - name: Test macOS before packaging
        if: matrix.platform == 'macos-arm64'
        run: |
          python3 -m unittest discover -s scripts/native/__tests__ -p 'test_package.py'
          python3 -m unittest discover -s scripts/native/__tests__ -p 'test_dev.py'
      - name: Build macOS
        if: runner.os == 'macOS'
        run: python3 scripts/native/build.py --target macos --configuration Release --build-number "$GITHUB_RUN_NUMBER" --output .native-build/release
      - name: Sign and verify the macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_MODE: ${{ needs.version.outputs.macos_mode }}
          ARCH: ${{ matrix.arch }}
          P12: ${{ secrets[needs.version.outputs.macos_mode == 'preview' && 'MACOS_PREVIEW_DEVELOPMENT_P12' || 'MACOS_DEVELOPER_ID_P12'] }}
          PASSWORD: ${{ secrets[needs.version.outputs.macos_mode == 'preview' && 'MACOS_PREVIEW_DEVELOPMENT_PASSWORD' || 'MACOS_DEVELOPER_ID_PASSWORD'] }}
          APPLE_ID: ${{ needs.version.outputs.macos_mode == 'distribution' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.version.outputs.macos_mode == 'distribution' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          set -euo pipefail
          : "${P12:?Missing signing certificate}" "${PASSWORD:?Missing certificate password}"
          umask 077
          keychain="$RUNNER_TEMP/viezan-signing.keychain-db"
          p12="$RUNNER_TEMP/viezan-release.p12"
          secret="$(uuidgen)"
          trap 'rm -f "$p12"; if [[ -e "$keychain" ]]; then security delete-keychain "$keychain"; fi' EXIT
          printf '%s' "$P12" | base64 -D > "$p12"
          security create-keychain -p "$secret" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$secret" "$keychain"
          security import "$p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          unset P12 PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$secret" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          if [[ "$MACOS_MODE" == preview ]]; then
            umask 022
            python3 scripts/native/package_macos_preview.py --input .native-build/release/Viezan.app --output .native-packages --arch "$ARCH"
            exit 0
          fi
          : "${APPLE_ID:?Missing APPLE_ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          record="$(security find-identity -v -p codesigning "$keychain" |
            sed -En 's/^[[:space:]]*[0-9]+\) ([[:xdigit:]]{40}) "Developer ID Application: .* \(([A-Z0-9]{10})\)"$/\1 \2/p')"
          if [[ -z "$record" || "$record" == *$'\n'* ]]; then
            echo "::error::Import one valid Developer ID Application certificate with its private key."
            exit 1
          fi
          read -r identity team_id <<< "$record"
          xcrun notarytool store-credentials ViezanRelease --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$team_id" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          umask 022
          python3 scripts/native/package.py --input .native-build/release/Viezan.app --output .native-packages \
            --identity "$identity" --notary-profile ViezanRelease --notary-keychain "$keychain"

      # Windows and Linux (Qt) --------------------------------------------
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0 libfuse2 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libpulse0 patchelf \
            libspeechd2
      - if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtspeech qtwebsockets'
          cache: true
      - name: Build Qt
        if: runner.os != 'macOS'
        run: python scripts/native/build.py --target qt --configuration Release --output .native-build/release --qt-prefix "${{ env.QT_ROOT_DIR }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_DEV_CERT_PFX }}
          PASSWORD: ${{ secrets.WINDOWS_DEV_CERT_PASSWORD }}
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          $arguments = @('--input', '.native-build/release/Release/ViezanNativeQt.exe', '--output', '.native-packages', '--qt-bin', "$env:QT_ROOT_DIR/bin")
          if ($env:PFX) {
            $file = Join-Path $env:RUNNER_TEMP 'dev.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:PFX))
            $secure = ConvertTo-SecureString $env:PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Remove-Item $file
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $env:PATH = "$($signtool.DirectoryName);$env:PATH"
            $arguments += @('--certificate-thumbprint', $certificate.Thumbprint)
          } else { Write-Host 'No development certificate; the Windows build is unsigned.' }
          python scripts/native/package.py @arguments
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt" https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools/linuxdeploy" "$tools/linuxdeploy-plugin-qt"
          export PATH="$tools:$PATH"
          python scripts/native/package.py --input .native-build/release/ViezanNativeQt --output .native-packages \
            --linuxdeploy "$tools/linuxdeploy" --qt-bin "$QT_ROOT_DIR/bin"

      - uses: actions/upload-artifact@v7
        with:
          name: Viezan-${{ matrix.platform }}
          path: |
            .native-packages/*.dmg
            .native-packages/*.zip
            .native-packages/*.exe
            .native-packages/*.AppImage
            .native-packages/*.json
            .native-packages/latest*.yml
          if-no-files-found: error
          # .native-packages is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true

  macos-install:
    needs: [version, package]
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Viezan-macos-${{ matrix.arch }}
          path: packages
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.arch == 'arm64' && '26.3' || 'latest-stable' }}
      - name: Test clean installation and upgrades from released Mac disk images
        env:
          ARCH: ${{ matrix.arch }}
          MACOS_MODE: ${{ needs.version.outputs.macos_mode }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for old in 2.4.2 2.5.2 2.6.0; do
            prefix="Viezan-$old-darwin"
            if [[ "$old" == 2.4.2 ]]; then prefix="Viezan-$old"; fi
            curl --fail --location --retry 3 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$old/$prefix-$ARCH.dmg" \
              --output "$RUNNER_TEMP/$prefix-$ARCH.dmg"
          done
          python3 scripts/native/test_macos_install.py --packages packages --old-images "$RUNNER_TEMP" \
            --mode "$MACOS_MODE" --arch "$ARCH" --version "$version"

  release:
    needs: [version, package, macos-install]
    if: inputs.preview_only != true
    runs-on: ubuntu-latest
    env:
      MACOS_MODE: ${{ needs.version.outputs.macos_mode }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Sign the update manifests
        shell: bash
        env:
          KEY: ${{ secrets.VIEZAN_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::VIEZAN_UPDATE_SIGNING_KEY is not set; the apps refuse an unsigned update."; exit 1; fi
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$KEY" > "$key")
          public="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)"
          for source in apps/macos/Sources/ViezanDomain/NativeUpdates.swift apps/desktop-qt/NativeUpdates.cpp; do
            if ! grep -qF "\"$public\"" "$source"; then echo "::error::The signing key does not match the public key in $source."; exit 1; fi
          done
          version="$(node -p "require('./package.json').version")"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update-public.pem"
          platforms=(win32-x64 linux-x64)
          if [[ "$MACOS_MODE" == preview ]]; then
            for arch in arm64 x64; do
              test -s "assets/Viezan-$version-preview-$arch.dmg"
              if compgen -G "assets/Viezan-$version-darwin-$arch.*" >/dev/null; then
                echo "::error::Unexpected macOS distribution assets in Preview mode."
                exit 1
              fi
            done
          else
            platforms+=(darwin-arm64 darwin-x64)
            # Electron 2.4.2's fallback uses a fixed name when GitHub's API is rate-limited.
            for arch in arm64 x64; do
              ln "assets/Viezan-$version-darwin-$arch.dmg" "assets/Viezan-$version-$arch.dmg"
            done
          fi
          for platform in "${platforms[@]}"; do
            manifest="assets/Viezan-$version-$platform.json"
            test -s "$manifest"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$manifest" | base64 -w0 > "$manifest.sig"
            base64 -d "$manifest.sig" > "$RUNNER_TEMP/update.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-public.pem" -in "$manifest" -sigfile "$RUNNER_TEMP/update.sig"
          done
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > changes.md
          {
            echo "## Viezan $tag"
            echo
            echo "Native apps only: SwiftUI/AppKit on macOS, Qt Quick/QML on Windows/Linux. The Electron app is retired."
            echo
            if [[ "$MACOS_MODE" == preview ]]; then
              base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/Viezan-$version-preview"
              echo "macOS Preview downloads: [Apple Silicon]($base-arm64.dmg) · [Intel]($base-x64.dmg)."
              echo "These internal test builds use the project's pinned Apple Development certificate and have not been notarized by Apple. Drag Viezan to Applications and open it. If you trust this build and macOS offers Open Anyway, choose it in System Settings → Privacy & Security."
            else
              echo "macOS: open the DMG for your Mac, drag Viezan to Applications, then open Viezan from Applications."
            fi
            echo
            echo "> Windows SmartScreen may warn. Windows and Linux Electron 2.4.x installs"
            echo "> can find the native packages through the legacy update feeds. On Windows the installer first removes the Electron app and"
            echo "> may ask for administrator approval; your data is kept."
            echo
            echo "### Changes"
            cat changes.md
            echo
            echo "Packages for in-app updates include a SHA-256 manifest and its Ed25519 signature. GitHub lists Preview DMG digests with the release assets."
          } > notes.md
          # Runs from develop publish the release, which creates the tag. Runs
          # from any other ref only prepare a draft.
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            create_flags=""
            edit_flags="--draft=false --target $GITHUB_SHA"
          else
            create_flags="--draft"
            edit_flags=""
          fi
          if existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [ "$GITHUB_REF" != "refs/heads/develop" ] && [ "$existing_draft" != true ]; then
              echo "::notice::$tag is already public. The tested packages are available in this run's artifacts."
              exit 0
            fi
            gh release upload "$tag" assets/* --clobber
            gh release edit "$tag" --notes-file notes.md $edit_flags
          else
            gh release create "$tag" assets/* $create_flags --target "$GITHUB_SHA" --title "Viezan $tag" --notes-file notes.md
          fi
