name: Native CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test --package-path apps/macos
      - run: python3 scripts/native/build.py --target macos --configuration Release --output .native-build/macos
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtspeech qtwebsockets'
          cache: true
      - run: cmake -S apps/desktop-qt -B .native-build/qt -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .native-build/qt --config Release --parallel 2
      # The full locale/size/theme/Glass 2.0 matrix (230+ rows) builds the
      # whole QML scene per row in a single-threaded QtTest process. CMake
      # registers it as shards (tests/RunShard.cmake), which ctest spreads
      # over the runner's cores; locally that is about one minute on four
      # jobs. Keep every case, a bounded per-function timeout and a bounded
      # per-shard timeout.
      - run: ctest --test-dir .native-build/qt -C Release --output-on-failure --timeout 1800 --parallel "$(python -c 'import os; print(os.cpu_count() or 2)')"
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Fusion
          QTEST_FUNCTION_TIMEOUT: '900000'
      - name: Print QtTest report
        if: always()
        run: python -c "from pathlib import Path; reports = sorted(Path('.native-build/qt').glob('qt-test-results-*.txt')); [print(p.read_text(encoding='utf-8', errors='replace')) for p in reports] or print('QtTest did not produce a report')"
