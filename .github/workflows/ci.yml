name: CI

on:
    push:
        branches: [main, develop]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
            - "LICENSE"
            - ".gitignore"
            - ".markdownlint.json"
            - "package.json"
            - "package-lock.json"
    pull_request:
        branches: [main, develop]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
            - "LICENSE"
            - ".gitignore"
            - ".markdownlint.json"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ─────────────────────────────────────────────
    # 1. Lint with Biome
    # ─────────────────────────────────────────────
    lint:
        name: Lint (Biome)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Run Biome
              run: npx biome ci .

            - name: Check Atomic Design boundaries
              run: npm run check:atomic

            - name: Check design tokens
              run: npm run check:design

    # ─────────────────────────────────────────────
    # 2. Type-check (renderer + electron)
    # ─────────────────────────────────────────────
    typecheck:
        name: Type-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Type-check renderer (tsconfig.json)
              run: npx tsc -p tsconfig.json --noEmit

            - name: Type-check electron (tsconfig.electron.json)
              run: npx tsc -p tsconfig.electron.json --noEmit

    # ─────────────────────────────────────────────
    # 3. Unit + integration tests with coverage
    # ─────────────────────────────────────────────
    test:
        name: Test (Vitest)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Run tests
              run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=./reports/junit.xml

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: junit-report
                  path: reports/junit.xml
                  retention-days: 7

    # ─────────────────────────────────────────────
    # 4. Build matrix — verify the app compiles on
    #    macOS / Windows / Linux on every PR + push.
    #    We do NOT publish; we just make sure the
    #    full electron-builder pipeline runs cleanly.
    # ─────────────────────────────────────────────
    build:
        name: Build (${{ matrix.os }})
        needs: [lint, typecheck, test]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux build deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build (renderer + electron)
              run: npm run build

            - name: Build artifacts (no publish)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: npx electron-builder --publish never

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: viezan-${{ runner.os }}-${{ github.sha }}
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.exe
                      release/*.AppImage
                      release/*.yml
                      release/*.blockmap
                  retention-days: 5
                  if-no-files-found: ignore
