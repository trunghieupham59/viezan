name: Nightly Build

on:
    schedule:
        # 18:00 UTC = 01:00 sáng giờ Việt Nam (Asia/Saigon, UTC+7)
        - cron: "0 18 * * *"
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch / commit để build"
                required: false
                default: "develop"

permissions:
    contents: write

concurrency:
    group: nightly-${{ github.ref }}
    cancel-in-progress: true

jobs:
    nightly:
        name: Nightly (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || 'develop' }}
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install Linux build deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: Compute nightly version
              id: ver
              shell: bash
              run: |
                  BASE=$(node -p "require('./package.json').version")
                  STAMP=$(date -u +%Y%m%d)
                  SHORT=$(git rev-parse --short HEAD)
                  NIGHTLY="${BASE}-nightly.${STAMP}.${SHORT}"
                  npm version "$NIGHTLY" --no-git-tag-version --allow-same-version
                  echo "version=$NIGHTLY" >> "$GITHUB_OUTPUT"
                  echo "Nightly version: $NIGHTLY"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build
              run: npm run build

            - name: Build (no publish)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: npx electron-builder --publish never

            - name: Upload nightly artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: viezan-nightly-${{ runner.os }}-${{ steps.ver.outputs.version }}
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.exe
                      release/*.AppImage
                      release/*.yml
                      release/*.blockmap
                  retention-days: 14
                  if-no-files-found: ignore
