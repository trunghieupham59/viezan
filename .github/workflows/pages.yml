name: Deploy GitHub Pages

on:
    push:
        branches: [develop, main]
        paths: [docs/**]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Prepare published documentation
              run: |
                  rsync -a --exclude=/agents/ --exclude=/migration/reports/ --exclude=/migration/legacy-reference/agent-handbook/ docs/ "$RUNNER_TEMP/viezan-pages/"

            - name: Upload published documentation
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ runner.temp }}/viezan-pages

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
