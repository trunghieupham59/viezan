name: Native Version Metadata
# Native installers require explicit platform/signing selection. Version edits
# no longer create tags or publish an unreviewed application automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/native/documentation.mjs
