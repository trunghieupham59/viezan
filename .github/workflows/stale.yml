name: Close Stale Issues & PRs

on:
    schedule:
        - cron: "30 1 * * *" # Mỗi ngày lúc 01:30 UTC
    workflow_dispatch:

permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/stale@v11
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

                  # Issues
                  days-before-issue-stale: 60
                  days-before-issue-close: 14
                  stale-issue-label: "stale"
                  exempt-issue-labels: "pinned,security,bug,roadmap,help wanted,good first issue"
                  stale-issue-message: |
                      👋 This issue has been automatically marked as **stale** because it has not had recent activity.
                      It will be closed in 14 days if no further activity occurs. Thank you for your contributions!
                  close-issue-message: |
                      🔒 Closing this issue due to inactivity. Feel free to reopen it if it is still relevant.

                  # Pull Requests
                  days-before-pr-stale: 30
                  days-before-pr-close: 14
                  stale-pr-label: "stale"
                  exempt-pr-labels: "pinned,security,wip,blocked"
                  stale-pr-message: |
                      👋 This pull request has been automatically marked as **stale** because it has not had recent activity.
                      It will be closed in 14 days if no further activity occurs.
                  close-pr-message: |
                      🔒 Closing this pull request due to inactivity. Feel free to reopen it whenever you are ready to continue.

                  operations-per-run: 100
                  remove-stale-when-updated: true
                  ascending: true
