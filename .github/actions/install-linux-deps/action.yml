name: Install Linux build dependencies
description: Install the system packages required to build the Linux app (no-op on other runners).

runs:
    using: composite
    steps:
        - name: Install Linux build deps
          if: runner.os == 'Linux'
          shell: bash
          run: |
              sudo apt-get update
              sudo apt-get install -y \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf
