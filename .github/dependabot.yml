version: 2

updates:
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "06:00"
          timezone: "Asia/Ho_Chi_Minh"
      open-pull-requests-limit: 5
      labels:
          - "area/ci"
          - "type/chore"
      commit-message:
          prefix: "ci(deps)"
          include: scope
      groups:
          actions:
              patterns:
                  - "*"
